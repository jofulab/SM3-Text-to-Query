# SM3-Text-to-Query: the four databases plus one loader container per database.
#
#   docker compose up -d --build   # start everything; the *_loader containers import the data and exit
#   docker compose ps -a           # loaders show "Exited (0)" when the import and their self-test succeeded
#   docker compose down            # stop (data is kept in named volumes; a restart skips the import)
#   docker compose down -v         # stop and delete all data
#
# Host ports: PostgreSQL 5432, MongoDB 27018, Neo4j 7474/7687, GraphDB 7200. If one is taken, override it, e.g.
#   SM3_POSTGRES_PORT=15432 docker compose up -d   (also SM3_MONGODB_PORT, SM3_NEO4J_HTTP_PORT, SM3_NEO4J_BOLT_PORT, SM3_GRAPHDB_PORT)
# Credentials are for local use only; change them before exposing the ports.

services:
  postgres:
    image: postgres:15
    container_name: sm3_postgres
    environment:
      POSTGRES_USER: sm3
      POSTGRES_PASSWORD: sm3
      POSTGRES_DB: sm3
    ports:
      - "${SM3_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm3 -d sm3"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sm3-network

  postgres_loader:
    build:
      context: .
      dockerfile: src/setup_dbs/postgres/Dockerfile
    container_name: sm3_postgres_loader
    environment:
      DB_HOST: sm3_postgres
      DB_USER: sm3
      DB_PASSWORD: sm3
      DB_NAME: sm3
      SYNTHEA_DATA: /app/data
    volumes:
      - ./data/synthea_data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sm3-network

  neo4j:
    image: neo4j:5.11.0
    container_name: sm3_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      # APOC is used by the post-ingest steps in src/setup_dbs/neo4j/config_neo4j.yml
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_db_transaction_concurrent_maximum: 75
      NEO4J_dbms_memory_transaction_total_max: 4G
    ports:
      - "${SM3_NEO4J_HTTP_PORT:-7474}:7474"  # HTTP / browser
      - "${SM3_NEO4J_BOLT_PORT:-7687}:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - sm3-network

  neo4j_loader:
    build:
      context: .
      dockerfile: src/setup_dbs/neo4j/Dockerfile
    container_name: sm3_neo4j_loader
    environment:
      NEO4J_URI: bolt://sm3_neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      SYNTHEA_DATA: /app/data
    volumes:
      - ./data/synthea_data:/app/data:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - sm3-network

  mongodb:
    image: mongo:6.0
    container_name: sm3_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: sm3
      MONGO_INITDB_ROOT_PASSWORD: sm3
    command: mongod --auth --wiredTigerCacheSizeGB 1 --setParameter maxTransactionLockRequestTimeoutMillis=5000
    ports:
      - "${SM3_MONGODB_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok' localhost:27017/test"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - sm3-network

  mongodb_loader:
    build:
      context: .
      dockerfile: src/setup_dbs/mongodb/Dockerfile
    container_name: sm3_mongodb_loader
    environment:
      MONGO_HOST: sm3_mongodb
      MONGO_USER: sm3
      MONGO_PASSWORD: sm3
      SYNTHEA_DATA: /app/data
    volumes:
      - ./data/synthea_data:/app/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - sm3-network

  graphdb:
    image: ontotext/graphdb:10.3.2
    # Hyphen instead of underscore: this name is used as a host name in URLs
    container_name: sm3-graphdb
    environment:
      GDB_JAVA_OPTS: "-Xms1g -Xmx3g"
    ports:
      - "${SM3_GRAPHDB_PORT:-7200}:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - sm3-network

  graphdb_loader:
    build:
      context: .
      dockerfile: src/setup_dbs/graphdb/Dockerfile
    container_name: sm3_graphdb_loader
    environment:
      GRAPHDB_URL: http://sm3-graphdb:7200
      GRAPHDB_REPOSITORY: sm3_graphdb
      # Imports data/synthea_ttl.zip (the paper's RDF data). Set to 1 to convert the CSVs instead.
      GRAPHDB_CONVERT_FROM_CSV: "0"
    volumes:
      - ./data:/app/data:ro
    # The loader itself waits until GraphDB answers
    depends_on:
      - graphdb
    networks:
      - sm3-network

volumes:
  postgres_data:
  neo4j_data:
  mongodb_data:
  graphdb_data:

networks:
  sm3-network:
    driver: bridge
